<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="CSS 盒模型示意图：content 300 宽，padding 20，border 2，margin 16">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bbg)"/>

  <!-- margin -->
  <rect x="96" y="52" width="608" height="384" rx="10" fill="none" stroke="#d7c39a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="112" y="80" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#a3813c">margin: 16px</text>

  <!-- border -->
  <rect x="128" y="92" width="544" height="304" rx="8" fill="#fff8e8" stroke="#e0a94a" stroke-width="4"/>
  <text x="144" y="118" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#a06a14">border: 2px</text>

  <!-- padding -->
  <rect x="156" y="128" width="488" height="232" rx="6" fill="#e7edff" stroke="#2f5bff" stroke-width="2"/>
  <text x="172" y="154" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#1d3fd0">padding: 20px</text>

  <!-- content -->
  <rect x="196" y="168" width="408" height="152" rx="6" fill="#ffffff" stroke="#2f5bff" stroke-width="2"/>
  <text x="400" y="236" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="26" fill="#121a2b">width: 300px</text>
  <text x="400" y="266" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#5d6b82">内容区 content box</text>

  <!-- 尺寸标注 -->
  <line x1="196" y1="452" x2="604" y2="452" stroke="#2f5bff" stroke-width="1.5"/>
  <line x1="196" y1="444" x2="196" y2="460" stroke="#2f5bff" stroke-width="1.5"/>
  <line x1="604" y1="444" x2="604" y2="460" stroke="#2f5bff" stroke-width="1.5"/>
  <text x="400" y="478" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#3c5aa8">content-box 外沿 = 300 + 20×2 + 2×2 = 344px</text>

  <text x="96" y="40" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#7b8aa1">从里到外：content → padding → border → margin</text>
</svg>
