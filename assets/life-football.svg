<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="足球场俯视示意图，带传球路线">
  <defs>
    <linearGradient id="turf" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f7a52"/>
      <stop offset="1" stop-color="#145c3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#turf)"/>
  <rect width="800" height="520" fill="url(#glow)"/>

  <!-- 草皮条纹 -->
  <g opacity="0.11">
    <rect x="0" y="0" width="80" height="520" fill="#ffffff"/>
    <rect x="160" y="0" width="80" height="520" fill="#ffffff"/>
    <rect x="320" y="0" width="80" height="520" fill="#ffffff"/>
    <rect x="480" y="0" width="80" height="520" fill="#ffffff"/>
    <rect x="640" y="0" width="80" height="520" fill="#ffffff"/>
  </g>

  <!-- 边线 -->
  <rect x="48" y="48" width="704" height="424" fill="none" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>
  <line x1="400" y1="48" x2="400" y2="472" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>
  <circle cx="400" cy="260" r="64" fill="none" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>
  <circle cx="400" cy="260" r="5" fill="#eaf7f0"/>

  <!-- 禁区 -->
  <rect x="48" y="152" width="100" height="216" fill="none" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>
  <rect x="652" y="152" width="100" height="216" fill="none" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>
  <rect x="48" y="204" width="42" height="112" fill="none" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>
  <rect x="710" y="204" width="42" height="112" fill="none" stroke="#eaf7f0" stroke-width="3" opacity="0.9"/>

  <!-- 球门 -->
  <rect x="40" y="228" width="8" height="64" fill="#eaf7f0" opacity="0.9"/>
  <rect x="752" y="228" width="8" height="64" fill="#eaf7f0" opacity="0.9"/>

  <!-- 传球路线 -->
  <path d="M186 336 C 268 300, 300 210, 386 196 S 512 236, 566 200" fill="none" stroke="#ffd089" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="9 8"/>
  <circle cx="186" cy="336" r="11" fill="#ffd089"/>
  <circle cx="386" cy="196" r="11" fill="#ffd089"/>
  <circle cx="566" cy="200" r="11" fill="#ffd089"/>
  <path d="M566 200 l-22 -6 6 18 z" fill="#ffd089" opacity="0.85"/>

  <!-- 球员 -->
  <g fill="#eaf7f0" opacity="0.85">
    <circle cx="248" cy="404" r="7"/>
    <circle cx="318" cy="120" r="7"/>
    <circle cx="470" cy="392" r="7"/>
    <circle cx="520" cy="300" r="7"/>
    <circle cx="640" cy="250" r="7"/>
  </g>

</svg>
